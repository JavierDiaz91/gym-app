name: Kivra SaaS checks

on:
  pull_request:
    paths:
      - 'lib/saas-billing-rules.ts'
      - 'app/actions.ts'
      - 'service-gym-api/src/**'
      - 'service-gym-api/package*.json'
      - 'app/middleware.ts'
      - 'app/admin/**'
      - 'lib/saas-access.ts'
      - 'tests/saas-billing-rules.test.ts'
      - 'app/api/saas/**'
      - 'app/admin/mi-suscripcion/**'
      - 'scripts/saas-*.sql'
      - '.github/workflows/kivra-saas-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run billing rules tests
        run: node --experimental-strip-types --test tests/saas-billing-rules.test.ts
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js application
        env:
          # Placeholder for module initialization during static build only.
          # No Neon connection or payment integration is exercised by CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
        run: npm run build

  render-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-gym-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Render API dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile Render API
        run: npm run build
      - name: Test Render SaaS pilot authorization policy
        run: node --experimental-strip-types --test tests/saasPilotPolicy.test.ts
