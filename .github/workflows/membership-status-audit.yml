name: Membership status audit (read-only)

# Review-only workflow. Does not update subscriptions or call the sync function.
# Scheduled execution must be added separately after validation and approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Verify database connection secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret NEON_DATABASE_URL"
            exit 1
          fi

      - name: Audit membership transitions without modifying data
        shell: bash
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q -t -A <<'SQL'
          SELECT 'ready_to_activate=' || COUNT(*)
          FROM public.subscriptions
          WHERE status = 'scheduled'
            AND start_date <= CURRENT_DATE
            AND end_date > CURRENT_DATE;

          SELECT 'ready_to_expire=' || COUNT(*)
          FROM public.subscriptions
          WHERE status IN ('active', 'scheduled')
            AND end_date <= CURRENT_DATE;

          SELECT 'pending_payment_in_current_period=' || COUNT(*)
          FROM public.subscriptions
          WHERE status IN ('active', 'scheduled')
            AND payment_status <> 'paid'
            AND start_date <= CURRENT_DATE
            AND end_date > CURRENT_DATE;
          SQL
