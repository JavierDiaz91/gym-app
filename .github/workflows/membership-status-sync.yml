name: Membership status sync

# GitHub Actions schedules run on the repository default branch.
# 06:00 UTC = 03:00 Argentina (UTC-3, no daylight saving time).
on:
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: gym-membership-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Verify database connection secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing repository secret NEON_DATABASE_URL"
            exit 1
          fi

      - name: Verify migration 006 and inspect transitions (read-only)
        shell: bash
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q -t -A <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('public.sync_gym_membership_statuses()') IS NULL THEN
              RAISE EXCEPTION 'Missing public.sync_gym_membership_statuses() (migration 006)';
            END IF;
          END
          $$;
          SELECT 'ready_to_activate=' || COUNT(*)
          FROM public.subscriptions
          WHERE status = 'scheduled'
            AND start_date <= CURRENT_DATE
            AND end_date > CURRENT_DATE;
          SELECT 'ready_to_expire=' || COUNT(*)
          FROM public.subscriptions
          WHERE status IN ('active', 'scheduled')
            AND end_date <= CURRENT_DATE;
          SQL

      - name: Synchronize membership lifecycle
        shell: bash
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q -t -A <<'SQL'
          SELECT 'activated=' || activated || ', expired=' || expired
          FROM public.sync_gym_membership_statuses();
          SQL
